name: Bridge evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: bounded-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: compiler
        with:
          path: .bin
          key: gooo-linux-x64-0.6.38-dev-go1.27.3
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: GOBIN="$PWD/.bin" GOTOOLCHAIN=go1.27.3 go install github.com/kimjooyoon/meta-ontology-go/cmd/gooo@v0.6.38-dev
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/compare_division.py --gooo .bin/gooo
      - run: python3 tools/compare_text_length.py --gooo .bin/gooo
      - run: python3 tools/check_candidates.py --self-test --gooo .bin/gooo
      - run: python3 tools/verify_yaegi.py
      - run: python3 tools/verify_chroma.py
      - run: go -C examples/highlight-gooo test -race ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bridge-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 7
